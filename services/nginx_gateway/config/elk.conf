server {
    # Port
    listen 443 ssl;
    listen [::]:443 ssl;

    # SSL
    ssl_certificate     /run/secrets/ssl_certificate;
    ssl_certificate_key /run/secrets/ssl_key;

    # Main properties
    server_name kibana.localhost;

    # Block illegal url
    include /etc/nginx/rules.d/forbidden-urls-rule.conf;

    # Route to service
    location / {
        include /etc/nginx/rules.d/generic-proxy-rule.conf;
        proxy_pass http://kibana:5601;
    }

    # Logs
    access_log /var/log/nginx/nginx_elk_access.log;
    error_log  /var/log/nginx/nginx_elk_error.log;
}