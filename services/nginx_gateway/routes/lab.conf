server {
    # Port
    listen 443 ssl;
    listen [::]:443 ssl;

    # SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /run/secrets/ssl_certificate;
    ssl_certificate_key /run/secrets/ssl_key;

    # Main properties
    server_name lab.localhost;

    # Block illegal url
    include /etc/nginx/rules.d/forbidden-urls-rule.conf;

    # Route to RESTFUL endpoint
    location /api/ {
        proxy_pass http://lab:3000;
        include /etc/nginx/rules.d/restful-proxy-rule.conf;
    }

    # Route to WS endpoint
    location /ws/ {
        proxy_pass http://lab:3000;
        include /etc/nginx/rules.d/ws-proxy-rule.conf;
    }

    # Logs
    access_log /var/log/nginx/nginx_lab_access.log;
    error_log /var/log/nginx/nginx_lab_error.log;
}