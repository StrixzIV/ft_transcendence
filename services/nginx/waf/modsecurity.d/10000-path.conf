SecRule ARGS|REQUEST_FILENAME|REQUEST_URI_RAW "@rx (\.\./|\%2e\%2e|\%252e\%252e)" \
    "id:10001, \
    phase:1, \
    deny, \
    status:403, \
    severity:CRITICAL, \
    msg:'Path traversal attempt blocked', \
    log"

SecRule ARGS|REQUEST_FILENAME|REQUEST_URI_RAW "@rx (^|/)\.[^/]" \
    "id:10002, \
    phase:1, \
    deny, \
    status:403, \
    severity:CRITICAL, \
    msg:'Blocked access to hidden dotfile or directory', \
    log"
