# Block path traversal
SecRule ARGS|REQUEST_FILENAME|REQUEST_URI_RAW "@rx (\.\./|\%2e\%2e|\%252e\%252e)" \
    "id:10001, \
    phase:1, \
    deny, \
    status:403, \
    severity:CRITICAL, \
    msg:'Path traversal attempt blocked', \
    log"

# Block access dotfile
SecRule ARGS|REQUEST_FILENAME|REQUEST_URI_RAW "@rx (^|/)\.[^/]" \
    "id:10002, \
    phase:1, \
    deny, \
    status:403, \
    severity:CRITICAL, \
    msg:'Blocked access to hidden dotfile or directory', \
    log"

# Block access healthcheck endpoint (general)
SecRule REQUEST_URI_RAW "@rx /health" \
    "id:10003, \
    phase:1, \
    deny, \
    status:403, \
    severity:WARNING, \
    msg:'Blocked external access to health endpoint', \
    log"

# Block access healthcheck endpoint (kibana)
SecRule REQUEST_URI "@streq /api/status" \
    "id:10004,\
    phase:1,\
    deny,\
    status:403,\
    severity:WARNING, \
    msg:'Blocked /api/status on elk sub domain',\
    log,\
    chain"
    SecRule REQUEST_HEADERS:Host "@rx ^elk\." 
