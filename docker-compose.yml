services:

  # Gateway
  nginx:
    container_name: nginx
    image: nginx:1.29-alpine-slim
    restart: always
    networks:
      - mainnet
    volumes:
      - ./services/nginx/config/:/etc/nginx/conf.d/
      - ./services/nginx/routes/:/etc/nginx/routes.d/
      - ./frontend/dist/:/var/www/html/
    secrets:
      - ssl_key
      - ssl_certificate
    ports:
      - "8443:443"

  # ELK
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.12.0
    restart: always
    networks:
      - mainnet
    environment: 
      - discovery.type=single-node
      - xpack.security.enabled=false
    expose:
      - 9200

  logstash:
    container_name: logstash
    image: logstash:8.12.0
    restart: always
    networks:
      - mainnet
    volumes: 
      - "./logs:/var/log/services"
      - "./services/ELK/logstash.yml:/usr/share/logstash/config/logstash.yml"
      - "./services/ELK/logstash.conf:/usr/share/logstash/pipeline/logstash.conf"
    depends_on:
      - elasticsearch
    expose: 
      - 5044

  kibana:
    container_name: kibana
    image: kibana:8.12.0
    restart: always
    networks:
      - mainnet
    ports: 
      - 5601

networks:

  mainnet:
    driver: bridge

secrets:

  ssl_key:
    file: ./secrets/ssl/nginx-selfsigned.key

  ssl_certificate:
    file: ./secrets/ssl/nginx-selfsigned.crt