services:

  # Gateway
  nginx:
    container_name: nginx
    image: nginx:1.29-alpine-slim
    restart: always
    networks:
      - mainnet
    volumes:
      - ./services/nginx/config/default.conf:/etc/nginx/conf.d/default.conf
      - ./services/nginx/routes/:/etc/nginx/routes
      - ./frontend/dist/:/var/www/html
    secrets:
      - ssl_key
      - ssl_certificate
    ports:
      - "8443:443"

  # ELK
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.12.0
    restart: always
    networks:
      - mainnet
    environment: 
      - discovery.type=single-node
      - xpack.security.enabled=false
    expose:
      - 9200

  logstash:
    container_name: logstash
    image: logstash:8.12.0
    restart: always
    networks:
      - mainnet
    volumes: 
      - "./logs:/var/log/services"
      - "./services/ELK/logstash.yml:/usr/share/logstash/config/logstash.yml"
      - "./services/ELK/logstash.conf:/usr/share/logstash/pipeline/logstash.conf"
    depends_on:
      - elasticsearch
    expose: 
      - 5044

  kibana:
    container_name: kibana
    image: kibana:8.12.0
    restart: always
    networks:
      - mainnet
    ports: 
      - "5601:5601"

  # HashiCorp Vault
  vault:
    image: hashicorp/vault:1.16
    container_name: vault
    restart: always
    ports:
      - "8200:8200"
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://0.0.0.0:8200
      - VAULT_DEV_ROOT_TOKEN_ID=root
    cap_add:
      - IPC_LOCK
    entrypoint: vault server -dev -dev-listen-address=0.0.0.0:8200 -dev-root-token-id="root"
    volumes:
      - ./services/vault/config:/vault/config
      - ./services/vault/data:/vault/data
      - ./logs:/vault/logs

networks:

  mainnet:
    driver: bridge

secrets:

  ssl_key:
    file: ./secrets/ssl/nginx-selfsigned.key

  ssl_certificate:
    file: ./secrets/ssl/nginx-selfsigned.crt