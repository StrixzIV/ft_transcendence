services:

  # TLS Terminate Point
  nginx-ssl:
    container_name: nginx-ssl
    image: nginx:1.29-alpine-slim
    restart: always
    env_file:
      - env/.no_sensitive.env
    networks:
      - dmz-net
    environment:
      - WAF_ADDR=http://nginx-waf:8080
    volumes:
      - ./services/nginx_ssl/templates/:/etc/nginx/templates/:ro
      - ./services/nginx_ssl/rules.d/:/etc/nginx/rules.d/:ro
    secrets:
      - ssl-cert
      - ssl-key
    ports:
      - "8443:443"
    depends_on:
      - nginx-waf

  # WAF
  nginx-waf:
    container_name: nginx-waf
    build:
      context: ./services/nginx_waf
      dockerfile: Dockerfile
    restart: always
    env_file:
      - env/.no_sensitive.env
    networks:
      - dmz-net
    environment:
      - API_GATEWAY_ADDR=http://nginx-gateway:8080
    expose:
      - 8080
    depends_on:
      - nginx-gateway

  # Gateway
  nginx-gateway:
    container_name: nginx-gateway
    image: nginx:1.29-alpine-slim
    restart: always
    env_file:
      - env/.no_sensitive.env
    networks:
      - mainnet
      - dmz-net
      - vault-net
    volumes:
      - ./services/nginx_gateway/templates/:/etc/nginx/templates/:ro
      - ./services/nginx_gateway/rules.d/:/etc/nginx/rules.d/:ro
      - ./logs/nginx_gateway/:/var/log/nginx/:rw
    expose:
      - 8080
    depends_on:
      - frontend
      - kibana
      - lab
      - auth-backend

  # Frontend
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - env/.no_sensitive.env
    networks:
      - mainnet
    volumes:
      - ./logs/frontend/:/var/log/nginx/:rw
    expose:
      - 8080
    depends_on:
      - auth-backend
      - users-backend

  # RabbitMQ
  broker:
    container_name: broker
    image: rabbitmq:4.1.1-management-alpine
    restart: always
    env_file:
      - env/.broker.env
    networks:
      - mainnet
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq
      - rabbitmq-log:/var/log/rabbitmq
    expose:
      - 5672
      - 15672

  # ELK
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.12.0
    restart: always
    networks:
      - elk-net
    environment:
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - discovery.type=single-node
      - xpack.security.enabled=false
    expose:
      - 9200
    depends_on:
      - logstash

  logstash:
    container_name: logstash
    image: logstash:8.12.0
    restart: always
    networks:
      - elk-net
    volumes: 
      - ./logs/:/var/log/services/:ro
      - ./services/ELK/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./services/ELK/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    expose: 
      - 5044

  kibana:
    container_name: kibana
    image: kibana:8.12.0
    restart: always
    networks:
      - mainnet
      - elk-net
    ports: 
      - 5601
    depends_on:
      - elasticsearch

  # HashiCorp Vault
  vault:
    image: hashicorp/vault:1.16
    container_name: vault
    restart: always
    env_file:
      - env/.vault.env
    networks:
      - vault-net
      - vault-init-net
    volumes:
      - ./services/vault/scripts/vault_server.sh:/vault_server.sh:ro
      - ./services/vault/config:/vault/config:ro
      - ./data/vault/:/vault/data/:rw
      - ./logs/vault/:/vault/logs/:rw
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    entrypoint: /vault_server.sh
    expose:
      - 8200

  vault-init:
    image: hashicorp/vault:1.16
    env_file:
      - env/.vault.env
      - env/.token.env
    networks:
      - vault-init-net
    volumes:
      - ./services/vault/scripts/vault_init.sh:/vault_init.sh:ro
    environment:
      - VAULT_ADDR=http://vault:8200
    entrypoint: /vault_init.sh
    depends_on:
      - vault

  # Test
  lab:
    container_name: lab
    build:
      context: ./services/labratory
      dockerfile: Dockerfile
    networks:
      - mainnet
    volumes:
      - ./logs/lab:/logs/:rw
    environment:
      - NODE_ENV=production
    expose:
      - 3000

  # Backend
  auth-backend:
    container_name: auth-backend
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    env_file:
      - env/.vault.env
      - env/.google.env
    restart: always
    networks:
      - mainnet
      - vault-net
    volumes:
      - ./logs/auth-backend/:/logs/:rw
      - ./data/auth/:/prisma/db/:rw
    environment:
      - NODE_ENV=production
    depends_on:
      - vault
      - broker
    expose:
      - 3000

  users-backend:
    container_name: users-backend
    build:
      context: ./services/users
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: always
    networks:
      - mainnet
      - vault-net
    volumes:
      - ./logs/auth-backend/:/logs/
      - ./data/auth/:/prisma/db/
    environment:
      - NODE_ENV=production
    depends_on:
      - vault
      - broker
      - auth-backend
    expose:
      - 3000

networks:
  dmz-net:
    driver: bridge

  mainnet:
    driver: bridge

  elk-net:
    driver: bridge
    internal: true

  vault-net:
    driver: bridge
    internal: true

  vault-init-net:
    driver: bridge
    internal: true

volumes:
  rabbitmq-lib:
    driver: local

  rabbitmq-log:
    driver: local

secrets:
  ssl-cert:
    file: ./secrets/ssl/server.crt

  ssl-key:
    file: ./secrets/ssl/server.key
