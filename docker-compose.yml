services:

  # Gateway
  nginx:
    container_name: nginx
    image: nginx:1.29-alpine-slim
    restart: always
    networks:
      - mainnet
    volumes:
      - ./services/nginx/config/:/etc/nginx/conf.d/
      - ./services/nginx/routes/:/etc/nginx/routes.d/
      - ./services/nginx/rules/:/etc/nginx/rules.d/
      - ./frontend/dist/:/var/www/html/
    secrets:
      - ssl_key
      - ssl_certificate
    ports:
      - "8443:443"
    depends_on:
      - auth
      - kibana

  # Auth (Placeholder)
  # TODO: replace these lines with proper container
  auth:
    container_name: auth
    image: nginx:1.29-alpine-slim
    restart: always
    networks:
      - mainnet
    expose:
      - 3000

  # RabbitMQ
  broker:
    container_name: broker
    image: rabbitmq:4.1.1-management-alpine
    restart: always
    networks:
      - mainnet
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq
      - rabbitmq-log:/var/log/rabbitmq
    env_file:
      - ".env"
    expose:
      - 5672
      - 15672

  # ELK
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.12.0
    restart: always
    networks:
      - mainnet
    environment: 
      - discovery.type=single-node
      - xpack.security.enabled=false
    expose:
      - 9200
    depends_on:
      - logstash

  logstash:
    container_name: logstash
    image: logstash:8.12.0
    restart: always
    networks:
      - mainnet
    volumes: 
      - "./logs:/var/log/services"
      - "./services/ELK/logstash.yml:/usr/share/logstash/config/logstash.yml"
      - "./services/ELK/logstash.conf:/usr/share/logstash/pipeline/logstash.conf"
    depends_on:
      - elasticsearch
    expose: 
      - 5044

  kibana:
    container_name: kibana
    image: kibana:8.12.0
    restart: always
    networks:
      - mainnet
    ports: 
      - 5601
    depends_on:
      - elasticsearch

networks:
  mainnet:
    driver: bridge

volumes:
  rabbitmq-lib:
    driver: local

  rabbitmq-log:
    driver: local

secrets:
  ssl_key:
    file: ./secrets/ssl/nginx-selfsigned.key

  ssl_certificate:
    file: ./secrets/ssl/nginx-selfsigned.crt