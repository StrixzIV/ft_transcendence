services:

  # ELK
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.12.0
    restart: always
    networks:
      - mainnet
    environment: 
      - discovery.type=single-node
      - xpack.security.enabled=false
    expose:
      - 9200

  logstash:
    container_name: logstash
    image: logstash:8.12.0
    restart: always
    networks:
      - mainnet
    volumes: 
      - "./logs:/var/log/services"
      - "./services/ELK/logstash.yml:/usr/share/logstash/config/logstash.yml"
      - "./services/ELK/logstash.conf:/usr/share/logstash/pipeline/logstash.conf"
    depends_on:
      - elasticsearch
    expose: 
      - 5044

  kibana:
    container_name: kibana
    image: kibana:8.12.0
    restart: always
    networks:
      - mainnet
    ports: 
      - "5601:5601"

networks:
  mainnet:
    driver: bridge